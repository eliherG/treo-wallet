services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: postgres
      POSTGRES_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD:?Set POSTGRES_SUPERUSER_PASSWORD in .env}
      TREO_APP_PASSWORD: ${TREO_APP_PASSWORD:?Set TREO_APP_PASSWORD in .env}
      TREO_MIGRATOR_PASSWORD: ${TREO_MIGRATOR_PASSWORD:?Set TREO_MIGRATOR_PASSWORD in .env}
    ports:
      - "127.0.0.1:${DB_PORT:-5433}:5432"
    volumes:
      - treo_postgres_data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 5s
      timeout: 3s
      retries: 15
      start_period: 10s

volumes:
  treo_postgres_data:
